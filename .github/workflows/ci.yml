name: CI

on:
  push:
  pull_request:

jobs:
  engine-tests:
    name: Deduction engine tests
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        working-directory: ClueEngine
        run: swift test

  app-build:
    name: Build iPhone app
    # Xcode 27.1 (iOS 27.1 SDK, iPhone Duo) is only on the Xcode 27 image.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Use Xcode 27.1
        run: scripts/select-xcode.sh
      - name: Build for the iOS Simulator
        run: |
          xcodebuild build \
            -project ClueSheet.xcodeproj \
            -scheme ClueSheet \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
