name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    name: Simulator screenshots
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Use Xcode 27.1
        run: scripts/select-xcode.sh
      - name: Install duoctl to fold the iPhone Duo simulator
        run: brew install skarol/tap/duoctl
      - name: Capture screenshots
        run: scripts/screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
      # Also keep them on a "screenshots" branch so they can be viewed on
      # GitHub without downloading anything.
      - name: Publish to the screenshots branch
        run: |
          cd screenshots
          git init -q -b screenshots
          git add *.png
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Screenshots of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" screenshots
